name: CityChainApp
options:
  bundleIdPrefix: com.soundblaster
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftDecisionExamples:
    path: .
targets:
  CityChainApp:
    type: application
    platform: iOS
    sources:
      - path: CityChainApp
    dependencies:
      - package: SwiftDecisionExamples
        product: CityChainGame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.soundblaster.citychain
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  OracleBallApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OracleBallApp
    dependencies:
      - package: SwiftDecisionExamples
        product: OraclePresentation
      - package: SwiftDecisionExamples
        product: OracleGame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oracle
        INFOPLIST_KEY_NSMotionUsageDescription: Phone motion brings the oracle scene to life.
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.soundblaster.oracleball
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
