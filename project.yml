name: CityChainApp
options:
  bundleIdPrefix: com.soundblaster
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftDecisionExamples:
    path: .
    traits: [GLiNER]
  NestedA11yIDs:
    url: https://github.com/SoundBlaster/NestedA11yIDs.git
    from: 1.0.0
schemes:
  CityChainApp:
    build:
      targets:
        CityChainApp: all
    test:
      targets:
        - CityChainAppUITests
targets:
  CityChainApp:
    type: application
    platform: iOS
    sources:
      - path: CityChainApp
        excludes:
          - Resources/ScoutFacts/state-facts-v1.json
      - path: CityChainApp/Resources/ScoutFacts/state-facts-v1.json
        buildPhase: resources
    dependencies:
      - package: SwiftDecisionExamples
        product: CityChainGame
      - package: SwiftDecisionExamples
        product: CityChainPresentation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: City Chain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CityChainApp/CityChainApp.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: P8T2366K8X
        PRODUCT_BUNDLE_IDENTIFIER: com.soundblaster.citychain
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.1*]": "$(inherited) CITYCHAIN_HAS_RESERVED_REGIONS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.1*]": "$(inherited) CITYCHAIN_HAS_RESERVED_REGIONS"

  CityChainAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CityChainAppUITests
    dependencies:
      - target: CityChainApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.soundblaster.citychain.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  OracleBallApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OracleBallApp
    dependencies:
      - target: OracleWidgetsExtension
        embed: true
      - target: OracleModelDownloader
        embed: true
      - package: SwiftDecisionExamples
        product: OraclePresentation
      - package: SwiftDecisionExamples
        product: OracleGame
      - package: SwiftDecisionExamples
        product: OracleHistory
      - package: SwiftDecisionExamples
        product: OracleGLiNER
      - package: NestedA11yIDs
        product: NestedA11yIDs
    entitlements:
      path: OracleBallApp/OracleBallApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.egormerkushev.oracle
    info:
      path: OracleBallApp/Info.plist
      properties:
        CFBundleDisplayName: "Endless Answers"
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: "3"
        BAAppGroupID: group.ru.egormerkushev.oracle
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        NSMotionUsageDescription: Phone motion brings the oracle scene to life.
        UILaunchStoryboardName: LaunchScreen
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: ru.egormerkushev.oracle
            CFBundleURLSchemes:
              - oracleball
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: OracleBallApp/OracleBallApp.entitlements
        DEVELOPMENT_TEAM: P8T2366K8X
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.oracle
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - OracleBallAppUITests

  OracleBallAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OracleBallAppUITests
    dependencies:
      - target: OracleBallApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.oracle.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  OracleWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OracleWidgets
        excludes:
          - Info.plist
    dependencies:
      - package: SwiftDecisionExamples
        product: OracleGame
      - package: SwiftDecisionExamples
        product: OracleHistory
    entitlements:
      path: OracleWidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.egormerkushev.oracle
    info:
      path: OracleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Endless Answers Widgets
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: OracleWidgetsExtension.entitlements
        DEVELOPMENT_TEAM: P8T2366K8X
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.oracle.widgets
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  OracleModelDownloader:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OracleModelDownloader
        excludes: [Info.plist]
    entitlements:
      path: OracleModelDownloader/OracleModelDownloader.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.egormerkushev.oracle
    info:
      path: OracleModelDownloader/Info.plist
      properties:
        CFBundleDisplayName: Endless Answers Model Downloader
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: OracleModelDownloader/OracleModelDownloader.entitlements
        DEVELOPMENT_TEAM: P8T2366K8X
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.oracle.model-downloader
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
