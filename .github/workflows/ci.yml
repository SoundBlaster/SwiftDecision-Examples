name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  iOS:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: xcodebuild -version
      - name: Install Metal compiler for the Oracle shader
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -skipMacroValidation
          -project CityChainApp.xcodeproj
          -scheme CityChainApp
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
      - name: Build Oracle graphics demo
        run: >-
          xcodebuild
          -skipMacroValidation
          -project CityChainApp.xcodeproj
          -scheme OracleBallApp
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
      - name: Test the game engine
        run: swift test
