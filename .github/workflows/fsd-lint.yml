name: FSD Architecture Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FSD tooling
        uses: actions/checkout@v4
        with:
          repository: SoundBlaster/FSD
          ref: v0.4.0
          path: .fsd-ios-tooling
      - name: Run FSD architecture lint
        run: swift .fsd-ios-tooling/tools/fsd-ios.swift lint --config .fsd-ios.yml --format text
